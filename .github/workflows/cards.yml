name: Discord cards

# A Discord card for each pull request, each issue and each push to main (.github/scripts/discord-cards.py), posted
# when it comes and edited at each change: a push, an edit, a label, a review, a comment (the latest shown), and each
# job of its build as it ends (cards-watch.yml). publish-builds.py draws a nightly's card again once it is published.
# Nothing of a pull request runs here: the checkout is main's, and its build is only read. A review of a fork's pull
# request runs without the secrets, so its card waits for the next event. Each card's message id is kept in this
# repository's discord-cards branch. The secrets: DISCORD_WEBHOOK_NIGHTLY, DISCORD_WEBHOOK_PRS and
# DISCORD_WEBHOOK_ISSUES are the channels' webhooks (without one, nothing is posted there and the run says so). The
# first run of a card claims it before posting it, so the runs one event starts never post it twice; with no
# concurrency group, none of them is cancelled
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed, ready_for_review, converted_to_draft, labeled, unlabeled,
      assigned, unassigned]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, typed, untyped, assigned, unassigned, milestoned,
      demilestoned]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write # the cards' branch, discord-cards
  actions: read # a build's jobs and its artifact
  pull-requests: read
  issues: read

env:
  PYTHONUNBUFFERED: '1' # each line in the log as it happens
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DISCORD_WEBHOOK_NIGHTLY: ${{ secrets.DISCORD_WEBHOOK_NIGHTLY }}
  DISCORD_WEBHOOK_PRS: ${{ secrets.DISCORD_WEBHOOK_PRS }}
  DISCORD_WEBHOOK_ISSUES: ${{ secrets.DISCORD_WEBHOOK_ISSUES }}

jobs:
  card:
    name: Draw the card
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # main's scripts, and for a push its history, which a nightly's changes come from
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          sparse-checkout: .github/scripts
      - run: python3 .github/scripts/discord-cards.py event --repo "$GITHUB_REPOSITORY" --checkout .
