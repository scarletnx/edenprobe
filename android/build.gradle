// androidprobe: one APK of cases whose report has edenprobe's format (README.md). tools/build.sh runs this with
// -Pandroidprobe.out=DIR, where everything the build writes goes.
plugins {
    id 'com.android.application' version '9.4.0'
}

def out = file(providers.gradleProperty('androidprobe.out').orElse(layout.projectDirectory.dir('build').asFile.path).get())
layout.buildDirectory = new File(out, 'gradle')

// The report's run folder and its first note name the source the APK was built from
def revision = providers.exec {
    commandLine 'git', 'describe', '--always', '--dirty', '--abbrev=9'
    workingDir = projectDir
}.standardOutput.asText.get().trim()

android {
    namespace = 'dev.dravee.androidprobe'
    compileSdk = 36
    ndkVersion = '28.2.13676358'
    defaultConfig {
        applicationId = 'dev.dravee.androidprobe'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        buildConfigField 'String', 'REVISION', "\"${revision}\""
        // arm64-v8a for phones and ScarletNX's layer, x86_64 for the emulator's own bionic
        ndk { abiFilters += ['arm64-v8a', 'x86_64'] }
    }
    buildFeatures.buildConfig = true
    externalNativeBuild.cmake {
        path = file('src/main/cpp/CMakeLists.txt')
        version = '3.31.6'
        buildStagingDirectory = new File(out, 'cxx')
    }
    // the libraries extracted at install, as the layer always does: /proc/self/maps then names libandroidprobe.so
    packaging.jniLibs.useLegacyPackaging = true
    // the debug build is the probe: debuggable, so run-as reads its files, signed with the machine's debug key
    buildTypes.debug.debuggable = true
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
